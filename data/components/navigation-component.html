        <script>
            document.addEventListener("DOMContentLoaded", () => {
                const currentFile = window.location.pathname.split("/").pop() || "index.html";
                const comingSoonOverlay = document.getElementById("comingSoonOverlay");


                const logoUnlockTarget = document.querySelector("[data-logo-unlock='news']");
                const newsLinks = Array.from(document.querySelectorAll("[data-news-link='true']"));
                const newsUnlockStorageKey = "newsLinkUnlocked";
                let logoClickCount = 0;
                const logoClicksRequired = 10;

                const updateNewsVisibility = () => {
                    const isUnlocked = logoClickCount >= logoClicksRequired;
                    newsLinks.forEach((link) => {
                        link.style.display = isUnlocked ? "" : "none";
                    });
                };

                try {
                    if (window.localStorage.getItem(newsUnlockStorageKey) === "true") {
                        logoClickCount = logoClicksRequired;
                    }
                } catch (error) {
                    // localStorage may be unavailable in some browser privacy modes.
                }

                updateNewsVisibility();

                logoUnlockTarget?.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    logoClickCount += 1;
                    if (logoClickCount >= logoClicksRequired) {
                        try {
                            window.localStorage.setItem(newsUnlockStorageKey, "true");
                        } catch (error) {
                            // localStorage may be unavailable in some browser privacy modes.
                        }
                    }
                    updateNewsVisibility();
                });

                const closeComingSoon = () => {
                    comingSoonOverlay?.classList.add("hidden");
                    comingSoonOverlay?.classList.remove("flex");
                };

                const openComingSoon = () => {
                    comingSoonOverlay?.classList.remove("hidden");
                    comingSoonOverlay?.classList.add("flex");
                };
                
                document.querySelectorAll("[data-nav-link]").forEach((link) => {
                    const href = link.getAttribute("href");
                    link.classList.remove("highlight-current");
                    link.style.color = "";
                    link.addEventListener("mouseenter", () => {
                        //add underline on hover with inline style and red underline offset
                        link.style.textDecoration = "underline";
                        link.style.textUnderlineOffset = "4px"; 
                        link.style.color = "#DC2626";

                    })

                    link.addEventListener("mouseleave", () => {
                        //remove underline on mouse leave
                        link.style.textDecoration = "none"; 
                        link.style.color = "";
                    })
                    
                    if (!href) {
                        return;
                    }
                    const linkFile = href.split("/").pop();
                    if (linkFile === currentFile) {
                        
                        //link.classList.add("", "font-bold","highlight-current");
                        link.style.color = "#DC2626";
                    }
                });

                /*document.querySelectorAll('a[href="about-us.html"],a[href="contact-us.html"]').forEach((link) => {
                    link.addEventListener("click", (event) => {
                        event.stopPropagation();
                        event.preventDefault();
                        openComingSoon();
                    });
                });*/

                comingSoonOverlay?.addEventListener("click", (event) => {
                    if (event.target === comingSoonOverlay) {
                        closeComingSoon();
                    }
                });

                comingSoonOverlay?.querySelectorAll(".coming-soon-close").forEach((button) => {
                    button.addEventListener("click", closeComingSoon);
                });
            });
        </script>
